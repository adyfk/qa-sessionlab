name: Feature request
description: Suggest an idea for testers
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes: { label: What testing problem would this solve? }
    validations: { required: true }
  - type: textarea
    id: idea
    attributes: { label: Proposed solution }
  - type: textarea
    id: alternatives
    attributes: { label: Alternatives you considered }
